<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Pip's face on the caret gradient (the caret-from and caret-to tokens of globals.css).
       favicon.ico and apple-icon.png are rasterized from this file. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a493f2"/>
      <stop offset="1" stop-color="#4a74e6"/>
    </linearGradient>
    <radialGradient id="vinyl" cx="0.36" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.6" stop-color="#f6f4ff"/>
      <stop offset="1" stop-color="#d9d3fa"/>
    </radialGradient>
  </defs>
  <circle cx="32" cy="32" r="32" fill="url(#sky)"/>
  <ellipse cx="32" cy="34" rx="23" ry="20.5" fill="url(#vinyl)"/>
  <ellipse cx="25" cy="32.5" rx="3.8" ry="5.6" fill="#1d1b33"/>
  <ellipse cx="39" cy="32.5" rx="3.8" ry="5.6" fill="#1d1b33"/>
  <circle cx="26.3" cy="30.2" r="1.15" fill="#ffffff" opacity="0.85"/>
  <circle cx="40.3" cy="30.2" r="1.15" fill="#ffffff" opacity="0.85"/>
</svg>
